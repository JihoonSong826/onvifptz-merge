[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onvif-ptz-controller"
version = "0.2.0"
description = "Bounded multi-camera ONVIF PTZ control with offline tests"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
zeep = ["zeep>=4.3,<5"]

[tool.setuptools.packages.find]
include = ["ptz_control*"]
